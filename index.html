<style>
  /* Brand font (Space Grotesk, SIL Open Font Licence), served from our own site */
  @font-face { font-family:"Space Grotesk"; font-weight:600; font-style:normal; font-display:swap;
               src:url("/fonts/space-grotesk-latin-600-normal.woff2") format("woff2"); }
  /* Brand colours from the logo kit README */
  :root { --navy:#14233D; --navy-2:#0E1A2E; --teal:#5FC2C2; --gold:#D4A24C; --text:#E8ECF1; --muted:#9AA7B6; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body {
    min-height:100%;
    display:flex; flex-direction:column;
    color:var(--text);
    font:16px/1.6 "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    background:
      /* faint concentric rings, a nod to the ringfort in the logo */
      repeating-radial-gradient(circle at 88% 110%, rgba(95,194,194,.07) 0 1px, transparent 1px 46px),
      radial-gradient(ellipse at 15% 0%, #1c3152 0%, transparent 60%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
    background-attachment:fixed;
  }
  main { flex:1; display:flex; align-items:center; padding:48px 8vw; }
  .wrap { max-width:640px; animation:rise .9s ease-out both; }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .wrap { animation:none; } }
  .logo { display:block; width:280px; max-width:70vw; height:auto; margin:0 0 56px -11px; } /* the logo file has a little built-in padding; this lines it up with the text */
  .kicker {
    margin:0 0 18px;
    color:var(--gold);
    font-size:13px; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
  }
  h1 {
    font-family:"Space Grotesk", "Segoe UI", system-ui, sans-serif;
    margin:0 0 28px;
    font-size:clamp(32px, 5vw, 52px); line-height:1.12; font-weight:600; letter-spacing:-.015em;
    color:#fff;
  }
  .rule { width:56px; height:2px; background:var(--gold); border:0; margin:0 0 28px; }
  .contact { margin:0; color:var(--muted); font-size:16px; }
  .contact a {
    color:var(--teal); text-decoration:none; font-weight:600;
    border-bottom:1px solid rgba(95,194,194,.4); padding-bottom:2px;
  }
  .contact a:hover, .contact a:focus { color:#fff; border-bottom-color:#fff; }
  footer { padding:24px 8vw; color:#6F7F92; font-size:13px; letter-spacing:.02em; }
  footer .sep { margin:0 10px; }
  footer a { color:#8FA0B4; text-decoration:none; }
  footer a:hover, footer a:focus { color:#fff; }
  /* Centred layout (chosen 24 Nov): heading on one line on wide screens */
  main { justify-content:center; text-align:center; }
  .wrap { max-width:1000px; }
  .logo { width:320px; margin:0 auto 64px; }
  h1 { font-size:clamp(30px, 4.6vw, 56px); line-height:1.2; margin-bottom:32px; }
  .rule { margin:0 auto 32px; }
  .contact { font-size:18px; }
  footer { text-align:center; }
  /* Layout (24 Nov): logo top-left, heading centred, contact bottom-left */
  header.top { padding:32px 8vw 0; }
  header.top .logo { width:230px; margin:0 0 0 -9px; }
  footer { display:flex; justify-content:space-between; align-items:center; gap:12px 24px; flex-wrap:wrap; text-align:left; padding:28px 8vw; }
  footer .email { color:var(--muted); font-size:15px; }
  footer .email a { color:var(--teal); font-weight:600; border-bottom:1px solid rgba(95,194,194,.4); padding-bottom:2px; }
  footer .email a:hover, footer .email a:focus { color:#fff; border-bottom-color:#fff; }
  @media (max-width:560px) { header.top .logo { width:190px; } footer { flex-direction:column; align-items:flex-start; } }
</style>
</head>
<body>
<header class="top">
  <img class="logo" src="ringfort-cyber-logo-white.svg" alt="Ringfort Cyber" width="230" height="59">
</header>
<main>
  <div class="wrap">
    <h1>Cyber Security For Irish Businesses</h1>
    <hr class="rule">
    <p class="contact">Our new website is on its way.</p>
  </div>
</main>
<footer>
  <span class="email">Contact: <a href="mailto:james@ringfortcyber.ie">james@ringfortcyber.ie</a></span>
  <span class="legal">© 2026 Ringfort Cyber<span class="sep">·</span><a href="https://www.linkedin.com/company/ringfortcyber/" rel="noopener">LinkedIn</a></span>
</footer>
</body>
</html>
